name: Alertes erreurs de prix

on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 min (GitHub peut décaler de quelques minutes)
  workflow_dispatch:          # bouton "Run workflow" pour tester à la main

permissions:
  contents: write             # pour sauvegarder la liste des deals déjà vus

concurrency:
  group: alertes
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Chercher les deals
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python alerte.py

      - name: Sauvegarder les deals déjà vus
        run: |
          git config user.name "alertes-bot"
          git config user.email "alertes-bot@users.noreply.github.com"
          git add deja_vus.json
          git diff --cached --quiet || git commit -m "maj deals vus [skip ci]"
          git push
